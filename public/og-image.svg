<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="50%" stop-color="#12121a"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#ff0080"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ff0080" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Grid pattern -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(0,212,255,0.04)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Glow circles -->
  <circle cx="200" cy="200" r="300" fill="url(#glow)" opacity="0.4"/>
  <circle cx="1000" cy="400" r="250" fill="url(#glow)" opacity="0.3"/>
  
  <!-- Logo icon -->
  <g transform="translate(100, 80)">
    <circle cx="48" cy="48" r="44" stroke="url(#accent)" stroke-width="3" fill="none"/>
    <path d="M22 48 L38 56 L74 36" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  
  <!-- Brand name -->
  <text x="200" y="108" font-family="Inter, sans-serif" font-size="48" font-weight="800" fill="#ffffff">
    Policy<tspan fill="url(#accent)">Lens</tspan>
  </text>
  
  <!-- Main heading -->
  <text x="100" y="320" font-family="Inter, sans-serif" font-size="56" font-weight="800" fill="#ffffff">
    Understand What You're
  </text>
  <text x="100" y="390" font-family="Inter, sans-serif" font-size="56" font-weight="800" fill="url(#accent)">
    Actually Agreeing To
  </text>
  
  <!-- Subtitle -->
  <text x="100" y="450" font-family="Inter, sans-serif" font-size="28" fill="#a0a0b0">
    Free AI-powered privacy policy &amp; terms of service analyzer
  </text>
  
  <!-- Bottom features -->
  <g transform="translate(100, 510)">
    <rect x="0" y="0" width="280" height="48" rx="24" fill="rgba(0,212,255,0.1)" stroke="rgba(0,212,255,0.2)" stroke-width="1"/>
    <text x="140" y="31" font-family="Inter, sans-serif" font-size="18" fill="#00d4ff" text-anchor="middle" font-weight="600">No signup required</text>
    
    <rect x="300" y="0" width="280" height="48" rx="24" fill="rgba(255,0,128,0.1)" stroke="rgba(255,0,128,0.2)" stroke-width="1"/>
    <text x="440" y="31" font-family="Inter, sans-serif" font-size="18" fill="#ff0080" text-anchor="middle" font-weight="600">100% free forever</text>
    
    <rect x="600" y="0" width="280" height="48" rx="24" fill="rgba(0,212,255,0.1)" stroke="rgba(0,212,255,0.2)" stroke-width="1"/>
    <text x="740" y="31" font-family="Inter, sans-serif" font-size="18" fill="#00d4ff" text-anchor="middle" font-weight="600">AI-powered analysis</text>
  </g>
  
  <!-- URL -->
  <text x="1000" y="600" font-family="Inter, sans-serif" font-size="20" fill="#6a6a7a" text-anchor="end">policylens.app</text>
</svg>
